<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — SAS App</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="center">
  <form id="loginForm" class="card login-card">
    <h1>🎓 SAS App</h1>
    <p class="sub">Soal Sumatif Akhir Semester<br>Kelas 4, 5, 6 — Multi Lembaga</p>
    <input id="username" placeholder="Username / NIS" required>
    <input id="password" type="password" placeholder="Password" required>
    <button type="submit">Masuk</button>
    <p id="msg" class="error"></p>
  </form>
<script src="config.js"></script>
<script>
document.getElementById('loginForm').onsubmit = async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  const msg = document.getElementById('msg');
  
  btn.disabled = true;
  btn.textContent = 'Memproses...';
  msg.textContent = '';

  // Memanggil fungsi apiPost dari config.js
  const d = await apiPost('login', {
    username: document.getElementById('username').value.trim(),
    password: document.getElementById('password').value
  });

  if (d.error) { 
    msg.textContent = d.error; 
    btn.disabled = false;
    btn.textContent = 'Masuk';
    return; 
  }

  // Simpan token dan data user
  localStorage.setItem('sas_token', d.token);
  localStorage.setItem('sas_user', JSON.stringify(d.user));
  
  // Redirect sesuai role, otomatis menambahkan BASE_URL
  const target = d.user.role === 'siswa' ? 'siswa.html' 
               : d.user.role === 'guru' ? 'guru.html' 
               : 'admin.html';
  window.location.href = window.BASE_URL + target;
};
</script>
</body>
</html>
